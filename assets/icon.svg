<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d28"/>
      <stop offset="1" stop-color="#0c0c11"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#6647e8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#34344a" stroke-width="6"/>
  <!-- chat bubble -->
  <g filter="url(#soft)">
    <path d="M 262 306
             q 0 -54 54 -54 h 392 q 54 0 54 54 v 244 q 0 54 -54 54 h -232 l -96 92 q -22 21 -22 -10 v -82 h -42 q -54 0 -54 -54 z"
          fill="url(#bubble)"/>
  </g>
  <!-- dim message lines -->
  <rect x="330" y="330" width="200" height="34" rx="17" fill="#ffffff" opacity="0.38"/>
  <rect x="330" y="398" width="292" height="34" rx="17" fill="#ffffff" opacity="0.38"/>
  <!-- the surfaced message -->
  <rect x="330" y="466" width="240" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
  <circle cx="642" cy="483" r="26" fill="#3ecf8e"/>
  <path d="M 630 483 l 9 9 l 16 -18" stroke="#0c0c11" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- relevancy bars along the bottom -->
  <g opacity="0.9">
    <rect x="322" y="716" width="56" height="56" rx="14" fill="#2c2c3d"/>
    <rect x="410" y="688" width="56" height="84" rx="14" fill="#3a3a52"/>
    <rect x="498" y="656" width="56" height="116" rx="14" fill="#8b6cff"/>
    <rect x="586" y="620" width="56" height="152" rx="14" fill="#3ecf8e"/>
  </g>
</svg>
