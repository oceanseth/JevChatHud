<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <title>JevChatHud</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <select id="profile-select" title="Active profile">
      <option value="">no profile</option>
    </select>
    <div class="spacer"></div>
    <button id="add-source-shortcut" title="Add a chat source">＋ source</button>
    <button id="pin-btn" title="Always on top">&#9650;</button>
    <button id="settings-btn" title="Settings (⌘,)">&#9881;</button>
  </header>

  <div id="controls">
    <label id="relevancy-label">
      relevancy <span id="relevancy-value">55</span>
      <input type="range" id="relevancy" min="0" max="100" value="55" />
    </label>
    <label id="see-all-label">
      <input type="checkbox" id="see-all" /> see all
    </label>
  </div>

  <div id="tagbar" title="Show only Jev-tagged kinds (>50% confidence). No tags selected = relevancy view.">
    <div id="tag-chips"></div>
    <span class="tag-bulk-group">
      <button id="tags-all" class="tag-bulk">all</button>
      <button id="tags-none" class="tag-bulk">none</button>
    </span>
  </div>

  <div id="status-row"></div>

  <main id="feed-wrap">
    <div id="feed"></div>
    <div id="empty-state" class="hidden">
      <div id="empty-icon">&#128172;</div>
      <div id="empty-title"></div>
      <div id="empty-hint"></div>
      <button id="empty-action" class="primary"></button>
    </div>
  </main>

  <footer id="statusbar">
    <span id="stats">no messages yet</span>
    <span id="judge-error" class="error"></span>
  </footer>

  <!-- Settings / profile editor overlay -->
  <div id="overlay" class="hidden">
    <div id="panel">
      <h2>Settings</h2>
      <label class="field">TypeSafe API key
        <input type="password" id="api-key" placeholder="ts-..." />
      </label>
      <label class="field">Model
        <input type="text" id="model" placeholder="jev-latest" />
      </label>

      <h2>Appearance</h2>
      <div class="row">
        <label class="field grow">Chat font
          <select id="appearance-font">
            <option value="system">System</option>
            <option value="rounded">System Rounded</option>
            <option value="helvetica">Helvetica Neue</option>
            <option value="avenir">Avenir Next</option>
            <option value="georgia">Georgia</option>
            <option value="menlo">Menlo (mono)</option>
          </select>
        </label>
        <label class="field grow">Density
          <select id="appearance-density">
            <option value="cozy">Cozy</option>
            <option value="compact">Compact</option>
          </select>
        </label>
      </div>
      <label class="field">Font size <span id="appearance-size-value">13</span>px
        <input type="range" id="appearance-size" min="11" max="20" value="13" />
      </label>
      <label id="appearance-timestamps-label">
        <input type="checkbox" id="appearance-timestamps" /> show message timestamps
      </label>

      <h2>Profiles</h2>
      <div class="row">
        <select id="edit-profile-select"></select>
        <button id="new-profile-btn">new</button>
        <button id="delete-profile-btn" class="danger">delete</button>
      </div>

      <div id="profile-editor">
        <label class="field">Profile name
          <input type="text" id="profile-name" placeholder="Friday variety stream" />
        </label>
        <label class="field">Stream context (Jev judges chat against this)
          <textarea id="profile-context" rows="3"
            placeholder="I'm speedrunning Elden Ring. Questions about the run and route matter; backseat gaming does not."></textarea>
        </label>

        <h3 id="sources-heading">Sources</h3>
        <div id="sources-list"></div>
        <div id="add-source-row">
          <button class="add-source src-twitch" data-type="twitch">＋ Twitch</button>
          <button class="add-source src-youtube" data-type="youtube">＋ YouTube</button>
          <button class="add-source src-discord" data-type="discord">＋ Discord</button>
          <button class="add-source src-facebook" data-type="facebook">＋ Facebook</button>
        </div>
      </div>

      <div class="row end">
        <button id="close-panel-btn">close</button>
        <button id="save-panel-btn" class="primary">save</button>
      </div>
    </div>
  </div>

  <script src="filter.js"></script>
  <script src="app.js"></script>
</body>
</html>
